[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./" }]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
robinhood_testnet = "${RH_TESTNET_RPC}"
robinhood_mainnet = "${RH_MAINNET_RPC}"

[etherscan]
robinhood_testnet = { key = "${BLOCKSCOUT_KEY}", chain = 46630, url = "https://explorer.testnet.chain.robinhood.com/api" }
robinhood_mainnet = { key = "${BLOCKSCOUT_KEY}", chain = 4663, url = "https://robinhoodchain.blockscout.com/api" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
